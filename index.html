<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siva Electronics</title>
    <style>
        body {
            margin: 0;
            background: linear-gradient(to top, rgb(235, 210, 210));
            box-sizing: border-box;
            font-family: sans-serif;
        }

        #header {
            width: 100%;
            background-color: aqua;
            margin-bottom: 10px;
            padding: 10px 0;
        }

        #about {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 0 20px;
        }

        .option {
            list-style: none;
            color: rgb(58, 43, 43);
            white-space: nowrap;
        }

        #heading {
            margin: 0;
            font-size: 2em;
        }

        #search {
            height: 30px;
            flex-grow: 1;
            max-width: 400px;
            margin: 0 10px;
            padding: 5px 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .order {
            display: flex;
            gap: 30px;
            padding: 0;
            margin: 0;
            flex-wrap: wrap;
        }

        #btn {
            height: 40px;
            padding: 0 20px;
            border-radius: 10px;
            border: none;
            background-color: #333;
            color: white;
            cursor: pointer;
        }

        .name {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 50px;
            width: 100%;
            border-top: 1px black solid;
            border-bottom: 1px black solid;
            margin-top: 20px;
            background-color: #f0f0f0;
        }

        .name h1 {
            font-size: 2.5em;
            margin: 0;
        }

        #mobiles {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .mob {
            border: 1px solid #ccc;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            background-color: white;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .Electronics {
            width: 100%;
            height: auto;
            display: block;
        }

        @media (max-width: 768px) {
            #about {
                flex-direction: column;
                align-items: center;
            }

            #search {
                width: 100%;
                max-width: none;
                margin: 10px 0;
            }

            .order {
                justify-content: center;
                gap: 15px;
            }

            #btn {
                margin-top: 10px;
            }

            .name h1 {
                font-size: 2em;
            }
        }

        @media (max-width: 480px) {
            .name h1 {
                font-size: 1.5em;
            }

            .order {
                flex-direction: column;
                text-align: center;
            }

            .option {
                padding: 5px 0;
            }
        }
        /* General layout for smaller laptops and tablets */
        @media (max-width: 1024px) {
            #mobiles {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        /* Tablet and larger phone screens */
        @media (max-width: 768px) {
            #about {
                flex-direction: column;
                align-items: center;
            }

            #search {
                width: 90%;
                margin: 10px 0;
            }

            .order {
                justify-content: center;
            }

            .name h1 {
                font-size: 2em;
            }

            #mobiles {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Mobile screens */
        @media (max-width: 480px) {
            #header {
                flex-direction: column;
                height: auto;
                padding: 10px 0;
            }

            #about {
                flex-direction: column;
                gap: 5px;
            }

            #btn {
                margin: 10px auto;
            }

            .order {
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }

            .name h1 {
                font-size: 1.5em;
            }

            #mobiles {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
